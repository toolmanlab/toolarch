[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolarch"
version = "0.1.0"
description = "Architecture intelligence for your codebase"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alex Xuelin" }]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]
llm = [
    "httpx>=0.25",
]

[project.scripts]
toolarch = "toolarch.cli.main:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
